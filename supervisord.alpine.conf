# Supervisor configuration for the Alpine-based image.
# Differences vs. supervisord.conf (Debian):
# - mariadbd lives at /usr/bin/mariadbd (Debian: /usr/sbin/mariadbd)
# - PHP-FPM binary is php-fpm82 (Debian: php-fpm8.2)
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
user=root

[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mysqld]
command=/usr/bin/mariadbd --user=mysql --console
autorestart=true
stdout_logfile=/var/log/mariadb-supervisor.log
stderr_logfile=/var/log/mariadb-supervisor.log
priority=10
startsecs=10

[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
autorestart=true
stdout_logfile=/var/log/asterisk-supervisor.log
stderr_logfile=/var/log/asterisk-supervisor.log
priority=20
startsecs=10
startretries=3

[program:php-fpm]
command=/usr/sbin/php-fpm82 -F
autorestart=true
stdout_logfile=/var/log/php-fpm-supervisor.log
stderr_logfile=/var/log/php-fpm-supervisor.log
priority=30

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/nginx-supervisor.log
stderr_logfile=/var/log/nginx-supervisor.log
priority=40
