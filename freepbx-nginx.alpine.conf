# Nginx site configuration for the Alpine-based image.
# Goes to /etc/nginx/http.d/freepbx.conf (Alpine convention).
# Difference vs. freepbx-nginx.conf (Debian): PHP-FPM is reached via
# TCP 127.0.0.1:9000 (Alpine php82-fpm default) instead of a Unix socket.
# (cache-buster: force layer refresh after daemon incident)
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/freepbx_access.log;
    error_log /var/log/nginx/freepbx_error.log;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html)$ {
        expires max;
        log_not_found off;
    }
}
