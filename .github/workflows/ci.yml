name: CI

# Automated builds on every push, weekly security rebuilds, manual runs.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - Docker Hub username (e.g. mleem97)
#   DOCKERHUB_TOKEN    - Docker Hub access token (Account Settings -> Security)
# Image signing is keyless (Sigstore OIDC), no extra secret needed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday 03:00 UTC: rebuild against fresh base images (security updates)
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: mleem97/lnxr-freepbx

jobs:
  # ------------------------------------------------------------------
  # Build all tags for amd64 + arm64 and push to Docker Hub
  # (pull requests build only, without pushing).
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # keyless Cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: dev
            dockerfile: dockerfile.optimized
            asterisk: "21"
            tarball: ""
          - tag: "17"
            dockerfile: dockerfile.optimized
            asterisk: "21"
            tarball: ""
          - tag: 17-alpine
            dockerfile: dockerfile.alpine
            asterisk: "21"
            tarball: ""
          - tag: "18"
            dockerfile: dockerfile.optimized
            asterisk: "18"
            tarball: "http://downloads.asterisk.org/pub/telephony/asterisk/releases/asterisk-18.26.4.tar.gz"
          - tag: 18-alpine
            dockerfile: dockerfile.alpine
            asterisk: "18"
            tarball: "http://downloads.asterisk.org/pub/telephony/asterisk/releases/asterisk-18.26.4.tar.gz"
          - tag: "19"
            dockerfile: dockerfile.optimized
            asterisk: "19"
            tarball: "http://downloads.asterisk.org/pub/telephony/asterisk/releases/asterisk-19.8.1.tar.gz"
          - tag: 19-alpine
            dockerfile: dockerfile.alpine
            asterisk: "19"
            tarball: "http://downloads.asterisk.org/pub/telephony/asterisk/releases/asterisk-19.8.1.tar.gz"
          - tag: "20"
            dockerfile: dockerfile.optimized
            asterisk: "20"
            tarball: ""
          - tag: 20-alpine
            dockerfile: dockerfile.alpine
            asterisk: "20"
            tarball: ""
          - tag: "21"
            dockerfile: dockerfile.optimized
            asterisk: "21"
            tarball: ""
          - tag: 21-alpine
            dockerfile: dockerfile.alpine
            asterisk: "21"
            tarball: ""
          - tag: "22"
            dockerfile: dockerfile.optimized
            asterisk: "22"
            tarball: ""
          - tag: 22-alpine
            dockerfile: dockerfile.alpine
            asterisk: "22"
            tarball: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          build-args: |
            ASTERISK_VERSION=${{ matrix.asterisk }}
            ASTERISK_TARBALL_URL=${{ matrix.tarball }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Sign image (keyless Cosign / Sigstore)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Verify signature target exists and sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # ------------------------------------------------------------------
  # Boot smoke test: fresh first-boot install must reach supervisord
  # with all services RUNNING and HTTP 200 on the web UI.
  # Representative tags only (full matrix would take hours).
  # ------------------------------------------------------------------
  smoke:
    name: Smoke ${{ matrix.tag }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tag: ["17", "17-alpine", "22"]
    steps:
      - name: Checkout (test script)
        uses: actions/checkout@v4

      - name: Run boot smoke test
        run: ./tests/smoke.sh ${{ env.IMAGE_NAME }}:${{ matrix.tag }}

  # ------------------------------------------------------------------
  # Vulnerability scan (informational: SARIF upload, no gate).
  # ------------------------------------------------------------------
  scan:
    name: Trivy ${{ matrix.tag }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tag: ["dev", "17", "17-alpine", "18", "18-alpine", "19", "19-alpine", "20", "20-alpine", "21", "21-alpine", "22", "22-alpine"]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: trivy-${{ matrix.tag }}
